<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Derivative Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h1>Derivative Calculator</h1>
  </nav>

  <main class="main-layout">
    <!-- Calculator Container -->
    <div class="container">
      <h2>Choose Derivative Type</h2>
      
      <div class="input-group">
        <label>Select Type:</label>
        <select id="calcType" onchange="toggleInputs()">
          <option value="first">First-order derivative</option>
          <option value="higher">Higher-order derivative</option>
          <option value="partial">Partial derivative</option>
          <option value="parametric">Parametric derivative</option>
          <option value="logarithmic">Logarithmic derivative</option>
        </select>
      </div>

      <div id="input-f" class="input-group">
        <label>Function f(x) or f(x,y):</label>
        <input type="text" id="expr" placeholder="e.g. x^2 + sin(x)">
      </div>

      <div id="input-var" class="input-group hidden">
        <label>Variable (e.g. x, y):</label>
        <input type="text" id="varName" value="x">
      </div>

      <div id="input-order" class="input-group hidden">
        <label>Order (n):</label>
        <input type="number" id="order" value="2">
      </div>

      <div id="input-parametric" class="hidden">
        <div class="input-group">
          <label>x(t):</label>
          <input type="text" id="xt" placeholder="e.g. cos(t)">
        </div>
        <div class="input-group">
          <label>y(t):</label>
          <input type="text" id="yt" placeholder="e.g. sin(t)">
        </div>
        <div class="input-group">
          <label>Parameter:</label>
          <input type="text" id="t" value="t">
        </div>
      </div>

      <button onclick="calculate()">Calculate</button>
      <div id="result">Result will appear here...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© <span id="year"></span> Bishnu Prasad | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
